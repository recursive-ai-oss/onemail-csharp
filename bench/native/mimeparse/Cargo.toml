[package]
name = "mimeparse"
version = "0.1.0"
edition = "2021"
publish = false

# A native reference for the MIME rows (not a gate): the released mail-parser and mail-builder crates from crates.io,
# used through their documented public API only.
[dependencies]
mail-parser = "=1.0.1"
mail-builder = "=2.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
