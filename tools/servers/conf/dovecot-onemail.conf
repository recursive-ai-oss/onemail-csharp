# Added to the image's configuration (conf.d is included last, so these win).
protocols = imap pop3 submission lmtp

# Test accounts: any user name, one shared password (USER_PASSWORD in the environment), mail under /srv/vmail.
mail_home = /srv/vmail/%{user | lower}

# Every mechanism the client implements that the plain-text test passwords allow.
auth_mechanisms {
  plain = yes
  login = yes
  cram-md5 = yes
  scram-sha-1 = yes
  scram-sha-256 = yes
  oauthbearer = yes
  xoauth2 = yes
}

# Bearer tokens are checked by a small introspection endpoint (oauth-introspect.py): "test-token" is the one valid token, for the user "test".
oauth2 {
  introspection_mode = post
  introspection_url = http://127.0.0.1:2526/introspect
  username_attribute = username
  active_attribute = active
  active_value = true
}

# Everything the submission service accepts is handed to the local sink; nothing leaves the machine.
submission_relay_host = 127.0.0.1
submission_relay_port = 2525
submission_relay_trusted = yes

# Without inotify (the state directory is a bind mount) Dovecot notices another session's changes only when it polls; poll often so IDLE tests do not wait.
mailbox_idle_check_interval = 1s

# The container runs without the privilege to chroot, so the login processes stay where they are.
service imap-login {
  chroot =
}

service pop3-login {
  chroot =
}

service submission-login {
  chroot =
}

# The image ships no zlib plugin, so Dovecot does not offer COMPRESS=DEFLATE here; the compression path is
# exercised against the servers that do (and in-process).
